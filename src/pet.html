<!doctype html>
<html><head><meta charset="utf-8"><title>万能团子</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #wrap { width: 128px; height: 128px; position: relative; cursor: grab; }
  #wrap:active { cursor: grabbing; }
  #hopper { position: absolute; left: 8px; top: 28px; width: 112px; height: 96px; transform-origin: 50% 100%; }
  svg#pet { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; transform-origin: 50% 100%; transition: filter .5s, opacity .2s; }
  /* 整只变成一团白（白光出场 / 发光变身用）：先去掉对比度变成灰，再提亮成白；直接 brightness 会在过渡时闪一下灰 */
  svg#pet.white { filter: contrast(0) brightness(2.2); }
  svg#pet.hidden { opacity: 0; transition: none; }
  #tail { transform-box: fill-box; transform-origin: 10% 100%; }
  #earL { transform-box: fill-box; transform-origin: 90% 100%; }
  #earR { transform-box: fill-box; transform-origin: 10% 100%; }
  .idle #hopper, .sleep #hopper { animation: bob 2.4s ease-in-out infinite; }
  .alert #hopper { animation: hop .9s ease-in-out infinite; }
  .busy #hopper { animation: bob .5s ease-in-out infinite; }
  .happy #hopper { animation: squash .5s ease-in-out 3; }
  .sad #hopper { animation: none; transform: translateY(3px); }
  .evolving #hopper, .entering #hopper, .cheer #hopper { animation: none !important; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 20% { transform: translateY(0) scale(1.08, .9); } 40% { transform: translateY(-14px) scale(.95, 1.05); } }
  @keyframes squash { 50% { transform: scale(1.1, .88); } }
  .sleep #eyesOpen, .happy #eyesOpen { display: none; }
  .idle #eyesClosed, .alert #eyesClosed, .busy #eyesClosed, .sad #eyesClosed, .focus #eyesClosed { display: none; }
  .blink #eyesOpen { display: none; } .blink #eyesClosed { display: inline; }
  .blink #capEyes { visibility: hidden; }
  #mouthO { display: none; } .alert #mouthO { display: inline; } .alert #mouth { display: none; }
  #sweat { display: none; } .sad #sweat { display: inline; }
  /* 被拎着：张嘴；被甩飞：闭眼张嘴冒汗 */
  .held #hopper, .fly #hopper { animation: none !important; }
  .held #mouthO, .fly #mouthO { display: inline; } .held #mouth, .fly #mouth { display: none; }
  .fly #eyesOpen { display: none; } .fly #eyesClosed { display: inline; } .fly #sweat { display: inline; }
  /* 晕：闭眼冒汗 */
  .dizzy #eyesOpen { display: none !important; } .dizzy #eyesClosed { display: inline !important; } .dizzy #sweat { display: inline !important; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 76%, #fff 0%, rgba(255,255,255,.9) 30%, rgba(255,255,255,0) 68%); }
  #ring { position: absolute; left: 39px; top: 62px; width: 50px; height: 50px; border: 3px solid #fff; border-radius: 50%; box-sizing: border-box; opacity: 0; pointer-events: none; }
  /* 发光变身时身后的一团光 */
  #aura { position: absolute; left: 14px; top: 26px; width: 100px; height: 100px; border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(.4); transition: opacity .4s, transform .4s;
    background: radial-gradient(circle, rgba(255,255,240,.95) 0%, rgba(255,250,210,.55) 45%, rgba(255,250,210,0) 70%); }
  .aura #aura { opacity: 1; transform: scale(1); animation: aura .35s ease-in-out infinite alternate; }
  @keyframes aura { to { transform: scale(1.12); } }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  .p { position: absolute; width: 4px; height: 4px; }
  /* 扭蛋：48×48，平时落在窗口底部 */
  #orb { position: absolute; left: 40px; top: -52px; width: 48px; height: 48px; display: none; overflow: visible; shape-rendering: crispEdges; transform-origin: 50% 100%; }
  #capTop { transform-box: fill-box; transform-origin: 8% 100%; }
  #capGlow { opacity: 0; }
  /* 头顶小物件 */
  .deco { position: absolute; font: bold 14px/1 "Microsoft YaHei", sans-serif; pointer-events: none; }
  #badge { display: none; right: 14px; top: 14px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 11px; background: #e5484d; color: #fff; text-align: center; line-height: 22px; font-size: 13px; }
  .alert #badge { display: block; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  /* 专注计时：团子在外面时顶在头上，在扭蛋里时贴着扭蛋 */
  #timer { display: none; left: 50%; top: 50px; transform: translateX(-50%); padding: 3px 8px; border-radius: 10px; background: #5a3a1e; color: #fff6e6; font: bold 13px/1 Consolas, "Microsoft YaHei", monospace; letter-spacing: .5px; white-space: nowrap; }
  #timer.on { display: block; }
  #timer.break { background: #4f9a3d; }
  .out #timer { top: 6px; }
  #gear { display: none; left: 54px; top: 6px; width: 20px; height: 20px; }
  .busy #gear { display: block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #zzz { display: none; left: 92px; top: 12px; color: #8a8f98; }
  .sleep #zzz { display: block; animation: float 2.4s ease-in-out infinite; }
  .toss #zzz, .held #zzz, .fly #zzz { display: none !important; }
  #heart { display: none; left: 56px; top: 4px; color: #e5484d; font-size: 18px; }
  .happy #heart { display: block; animation: float 1.2s ease-out infinite; }
  @keyframes float { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
</style></head>
<body>
<div id="wrap" class="idle">
  <div id="aura"></div>
  <svg id="orb" viewBox="0 0 12 12"></svg>
  <div id="hopper"><svg id="pet" class="hidden" viewBox="0 0 28 24"></svg></div>
  <div id="ring"></div>
  <div id="flash"></div>
  <div id="fx"></div>
  <svg id="gear" class="deco" viewBox="0 0 20 20"><g fill="#3d7bfd"><rect x="8" y="0" width="4" height="20"/><rect x="0" y="8" width="20" height="4"/><rect x="3" y="3" width="14" height="14" rx="3"/></g><rect x="7" y="7" width="6" height="6" fill="#fff"/></svg>
  <div id="zzz" class="deco">z<span style="font-size:11px">z</span></div>
  <div id="heart" class="deco">♥</div>
  <div id="badge" class="deco">1</div>
  <div id="timer" class="deco"></div>
</div>
<script src="sprites.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const svg = $('pet'), wrap = $('wrap'), hopper = $('hopper'), fx = $('fx'), orb = $('orb');
const NS = 'http://www.w3.org/2000/svg';
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const rarity = (k) => (DANGO_FORMS[k] || DANGO_FORMS.dango).rarity;
// 这只团子所在的扩展包定的出场 / 变身方式：{ appear: 'flash', morph: 'glow' }，没定就是空的（蹦出来、翻硬币）
const animOf = (k) => (DANGO_FORMS[k] || {}).anim || {};
let form = 'dango', mood = 'idle', animating = false, started = false;
let animKind = 'evolving', air = false, held = false, cheering = false, aura = false;

// 没事时团子待在扭蛋里不动；有事 / 点一下 / 专注时才出来
let popFast = false, spin = 0, flying = false;
let out = false, count = 0, chosen = 'random', next = 'dango', stay = false, band = false;
let peekUntil = 0, peekForm = null, releaseAs = null, showOnce = null, busy = false, lidAnim = null;
let dizzy = false, dizzyNext = false, cheerNext = null, lastHard = false, flyPeak = 0, hitMax = 0, throws = [], angryUntil = 0, fidgeting = false;

function setClass() {
  wrap.className = mood + (animating ? ' ' + animKind : '') + (air ? ' fly' : held ? ' held' : '') + (flying ? ' toss' : '') + (dizzy ? ' dizzy' : '') + (cheering ? ' cheer' : '') + (out ? ' out' : '') + (aura ? ' aura' : '');
}
// 这只团子的几种代表色（放粒子用）
function colors(k) {
  const f = DANGO_FORMS[k] || DANGO_FORMS.dango, p = f.pal;
  if (f.fx) return f.fx;
  const body = p.b && p.b[0] === '#' ? p.b : '#ffffff';
  return [body, p.l || '#ffffff', p.i || p.p || p.g || p.k || p.h || p.w || body, '#ffffff', '#fff6c8'];
}
const PARTY = ['#ff5f95', '#ffe066', '#7fd6ff', '#b9de8c', '#ffffff', '#ffa94d'];
const GOLD = ['#ffd54a', '#fff3b0', '#ffffff', '#ffb020'];

// 画团子；专注时给它绑一条红头带
function paint(f) {
  drawDango(svg, f);
  if (!band) return;
  const g = document.createElementNS(NS, 'g'); g.id = 'band';
  const px = (x, y, w, c) => { const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', 1); r.setAttribute('fill', c); g.appendChild(r); };
  px(5, 11, 18, '#e5484d'); px(4, 12, 20, '#e5484d');
  px(13, 11, 2, '#ffffff'); px(13, 12, 2, '#ffffff');               // 正中一个白点
  px(2, 11, 2, '#b52f35'); px(1, 12, 3, '#b52f35'); px(1, 13, 1, '#b52f35'); px(3, 13, 1, '#b52f35'); px(0, 14, 1, '#b52f35');   // 脑后的结和飘带
  svg.insertBefore(g, svg.querySelector('#eyesOpen'));
}

// ---------- 粒子 ----------
// 从 (cx, cy) 向外炸开（out=true）或从外圈吸进来（out=false）
function burst(n, cols, { cx = 64, cy = 88, r0 = 0, r1 = 60, dur = 700, size = 4, out = true } = {}) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rnd(-.2, .2), d1 = rnd(r1 * .6, r1);
    const p = document.createElement('div'); p.className = 'p';
    const s = Math.round(size * rnd(.7, 1.3)); p.style.width = p.style.height = s + 'px';
    p.style.background = cols[i % cols.length]; p.style.left = (cx - s / 2) + 'px'; p.style.top = (cy - s / 2) + 'px';
    fx.appendChild(p);
    const A = `translate(${Math.cos(a) * r0}px, ${Math.sin(a) * r0}px) scale(1)`;
    const B = `translate(${Math.cos(a) * d1}px, ${Math.sin(a) * d1 - (out ? 10 : 0)}px) scale(.3)`;
    p.animate(out ? [{ transform: A, opacity: 1 }, { transform: B, opacity: 0 }] : [{ transform: B, opacity: 0 }, { transform: A, opacity: 1 }],
      { duration: dur * rnd(.8, 1.2), easing: out ? 'cubic-bezier(.2,.7,.3,1)' : 'ease-in', fill: 'forwards' }).onfinish = () => p.remove();
  }
}
// 原地闪的十字小星星
const STAR = 'polygon(40% 0,60% 0,60% 40%,100% 40%,100% 60%,60% 60%,60% 100%,40% 100%,40% 60%,0 60%,0 40%,40% 40%)';
function twinkle(n, cols, dur = 900) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    const p = document.createElement('div'); p.className = 'p';
    p.style.left = rnd(16, 108) + 'px'; p.style.top = rnd(24, 112) + 'px'; p.style.background = cols[i % cols.length];
    p.style.clipPath = STAR; p.style.width = p.style.height = '9px'; fx.appendChild(p);
    p.animate([{ transform: 'scale(0)', opacity: 1 }, { transform: 'scale(1.2)', opacity: 1, offset: .4 }, { transform: 'scale(0)', opacity: 0 }],
      { duration: dur, easing: 'ease-out' }).onfinish = () => p.remove();
  }, i * (dur / n) * .6);
}
function flash(dur = 500) { $('flash').animate([{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 0 }], { duration: dur, easing: 'ease-out' }); }
function ring(dur = 600) { $('ring').animate([{ opacity: .9, transform: 'scale(.3)' }, { opacity: 0, transform: 'scale(2.4)' }], { duration: dur, easing: 'ease-out' }); }
// 撒花：从头顶往下飘的彩色小方块
function confetti(n) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'p'; p.style.background = PARTY[i % PARTY.length];
    const s = Math.round(rnd(3, 5)); p.style.width = s + 'px'; p.style.height = s + 'px';
    const x0 = rnd(10, 118); p.style.left = x0 + 'px'; p.style.top = rnd(-6, 14) + 'px'; fx.appendChild(p);
    p.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${rnd(-16, 16)}px, ${rnd(70, 112)}px) rotate(${rnd(-300, 300)}deg)`, opacity: 1, offset: .8 }, { transform: `translate(${rnd(-18, 18)}px, ${rnd(100, 118)}px) rotate(${rnd(-360, 360)}deg)`, opacity: 0 }],
      { duration: rnd(900, 1500), delay: rnd(0, 350), easing: 'cubic-bezier(.3,.2,.6,1)', fill: 'both' }).onfinish = () => p.remove();
  }
}

// ---------- 扭蛋 ----------
// 12×12 像素：下半实心底壳，上半玻璃罩，隔着玻璃能看见里面那只的脑袋；光标靠近它会睁眼看你
// 样式里可以带：指示灯（单独一组，能亮）；上半不透明时「里面」的样子（躲在盖子后面，掀开才看得见）
let lid, capIn, capEyes, capGlow, capLight;
function drawCapsule(key) {
  orb.innerHTML = '';
  const st = capStyle(), solid = st.glass === false;
  const mk = (id) => { const g = document.createElementNS(NS, 'g'); g.id = id; orb.appendChild(g); return g; };
  const bot = mk('capBot'); capIn = mk('capIn');
  if (solid) capEyes = mk('capEyes');      // 不透明：眼睛在盖子后面
  lid = mk('capTop');
  if (!solid) capEyes = mk('capEyes');     // 玻璃罩：眼睛画在玻璃前面，看得清
  capGlow = mk('capGlow'); capLight = mk('capLight');
  const px = (g, p, c) => { const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', p.x); r.setAttribute('y', p.y); r.setAttribute('width', 1); r.setAttribute('height', 1); r.setAttribute('fill', c || p.c); g.appendChild(r); return r; };
  for (const p of capsulePixels(key, { style: st })) {
    if (p.part === 'bot') { px(bot, p); if (p.c !== CAP_PAL.o) px(capGlow, p, '#ffffff'); }
    else if (p.part === 'top') px(lid, p);
    else if (p.part === 'light') px(capLight, p).dataset.c = p.c;
    else px(p.eye ? capEyes : capIn, p);
  }
  capEyes.style.display = awakeNow ? '' : 'none';
}
// 扭蛋样式：自带的几种 + 扩展包里带的
let capId = 'orange', capExtra = {}, extraForms = new Set();
const capStyle = () => DANGO_CAP_STYLES[capId] || capExtra[capId] || DANGO_CAP_STYLES.orange;
// 样式换了：等手头的动画放完再重画，免得打断
function redrawCapsule() { if (!started) return; if (animating || busy) return setTimeout(redrawCapsule, 500); drawCapsule(next); if (out) capInside(null); orb.style.transform = orb.style.transform || G; }
// 换里面那只（null = 空的：团子在外面）
function capInside(key) {
  if (!capIn) return;
  capIn.innerHTML = ''; capEyes.innerHTML = '';
  if (!key) return;
  for (const p of capsulePixels(key, { style: capStyle() })) if (p.part === 'in') {
    const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', p.x); r.setAttribute('y', p.y); r.setAttribute('width', 1); r.setAttribute('height', 1); r.setAttribute('fill', p.c);
    (p.eye ? capEyes : capIn).appendChild(r);
  }
}
// 里面那只醒没醒、往哪边看（-1 左 / 0 中 / 1 右）
let awakeNow = false;
function awake(on, look = 0) {
  awakeNow = on; if (!capEyes) return;
  capEyes.style.display = on ? '' : 'none';
  capEyes.setAttribute('transform', `translate(${look} 0)`);
}
// 底壳亮一下（白 = 眨一下；红 = 生气）
function glint(color = '#ffffff', ms = 380) {
  if (!capGlow) return;
  for (const r of capGlow.children) r.setAttribute('fill', color);
  return capGlow.animate([{ opacity: 0 }, { opacity: .85, offset: .25 }, { opacity: 0 }], { duration: ms, easing: 'ease-out' });
}
// 指示灯（样式里用 light 标出来的那几格）：亮 / 灭；没有指示灯的样式什么也不做
const hasLamp = () => !!(capLight && capLight.firstChild);
function lamp(on) { if (!hasLamp()) return; const c = capStyle().lightOn || '#ff5a4e'; for (const r of capLight.children) r.setAttribute('fill', on ? c : r.dataset.c); }
// 眨一下：有指示灯就闪灯，没有就底壳亮一下
function wink() { if (!hasLamp()) return glint(); lamp(true); setTimeout(() => lamp(false), 190); }
// 指示灯画在上半（盖子那半）的几格：显示 / 藏起来
function lampTop(show) { if (capLight) for (const r of capLight.children) if (+r.getAttribute('y') < 6) r.style.visibility = show ? '' : 'hidden'; }
const G = 'translateY(128px)'; // 扭蛋落地位置
async function wobble(n) {
  for (let i = 0; i < n; i++) {
    wink();
    await orb.animate([{ transform: `${G} rotate(0)` }, { transform: `${G} rotate(-22deg)` }, { transform: `${G} rotate(16deg)` }, { transform: `${G} rotate(0)` }],
      { duration: 400, easing: 'ease-in-out' }).finished;
    if (i < n - 1) await sleep(240);
  }
}
function openLid(ms = 140, deg = -62) { if (lidAnim) lidAnim.cancel(); lidAnim = lid.animate([{ transform: 'rotate(0)' }, { transform: `rotate(${deg}deg) translateY(-1px)` }], { duration: ms, easing: 'ease-out', fill: 'forwards' }); return lidAnim.finished; }
function closeLid(ms = 140, deg = -62) { if (lidAnim) lidAnim.cancel(); lidAnim = null; return lid.animate([{ transform: `rotate(${deg}deg) translateY(-1px)` }, { transform: 'rotate(0)' }], { duration: ms, easing: 'ease-in' }).finished; }

// 启动：扭蛋从上面转着掉下来，落地弹两下
async function dropBall() {
  animating = true; animKind = 'entering'; setClass();
  orb.style.display = 'block'; svg.classList.add('hidden');
  const a = orb.animate([
    { transform: 'translateY(0) rotate(-200deg)', easing: 'cubic-bezier(.5,0,1,1)' },
    { transform: `${G} scale(1.15, .85)`, offset: .5, easing: 'cubic-bezier(0,0,.5,1)' },
    { transform: 'translateY(100px) rotate(0)', offset: .68, easing: 'cubic-bezier(.5,0,1,1)' },
    { transform: `${G} scale(1.08, .92)`, offset: .84, easing: 'cubic-bezier(0,0,.5,1)' },
    { transform: 'translateY(120px)', offset: .92, easing: 'cubic-bezier(.5,0,1,1)' },
    { transform: G },
  ], { duration: 950 });
  await a.finished;
  orb.style.transform = G;
  animating = false; setClass();
}

// 开扭蛋：晃一晃、掀盖、「啵」地蹦出一只团子。
// 这只所在的扩展包写了 appear: flash 的话，换成白光出场：一团白色的轮廓从扭蛋里涨出来，站稳了再显出颜色
async function release(f) {
  animating = true; animKind = 'entering'; setClass();
  orb.style.display = 'block'; orb.style.opacity = 1;
  capInside(f); awake(true);
  hopper.style.transform = ''; hopper.style.transformOrigin = ''; tumble = 0; air = false;
  if (popFast) { if (settle) { await settle.finished.catch(() => { }); settle = null; await sleep(150); } popFast = false; orb.style.transform = G; orb.style.transformOrigin = ''; spin = 0; }
  else await wobble(count > 0 || stay ? 1 : 2);
  lamp(true);                                   // 有指示灯的：开盖前亮起来
  await sleep(100);
  await openLid();
  api.send('pet-seen', f);
  const rar = rarity(f), ssr = rar === 'SSR', beam = animOf(f).appear === 'flash';
  flash(ssr ? 900 : beam ? 620 : 480); ring(ssr ? 900 : 650);
  burst(ssr ? 30 : 18, ssr ? GOLD : colors(f), { cy: beam ? 104 : 98, r1: ssr ? 86 : 68 });
  capInside(null);
  const fade = orb.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 240, fill: 'forwards' });
  form = f; paint(f);
  if (beam) { svg.classList.add('white'); void svg.getBoundingClientRect(); }      // 还藏着的时候先变白（这时没有过渡），不然会看到颜色一闪
  svg.classList.remove('hidden');
  out = true; setClass(); api.send('pet-out', true); reportShape();
  if (beam) await svg.animate([{ transform: 'scale(.1)' }, { transform: 'scale(1.1, .9)', offset: .6 }, { transform: 'scale(.95, 1.06)', offset: .8 }, { transform: 'scale(1)' }], { duration: 520, easing: 'ease-out' }).finished;
  else await svg.animate([
    { transform: 'translateY(10px) scale(.12)', easing: 'cubic-bezier(.2,.8,.4,1)' },
    { transform: 'translateY(-22px) scale(.9, 1.1)', offset: .42, easing: 'cubic-bezier(.5,0,.8,.4)' },
    { transform: 'translateY(0) scale(1.15, .85)', offset: .72 },
    { transform: 'translateY(-4px) scale(.97, 1.04)', offset: .87 },
    { transform: 'scale(1)' }], { duration: 640 }).finished;
  await fade.finished;
  orb.style.display = 'none'; fade.cancel(); if (lidAnim) { lidAnim.cancel(); lidAnim = null; } lamp(false);
  svg.classList.remove('white');
  twinkle(rar === 'N' ? 5 : 10, ssr ? GOLD : colors(f));
  await sleep(beam ? 450 : 360);
  animating = false; setClass();
  if (dizzyNext) { dizzyNext = false; dizzyFx(); } else if (cheerNext) { const c = cheerNext; cheerNext = null; cheer(c.big); } else wagTail();
}

// 回扭蛋：扭蛋开着盖出现，团子蹲一下、跳起来扎进去，合盖；在里面又换了个样。

  if (r >= .8) return crack(900);
  fidgeting = true;
  try {
    if (r < .25) await wobble(1);
    else if (r < .4) wink();
    else if (r < .6) { awake(true, -1); await sleep(600); awake(true, 1); await sleep(600); awake(true, 0); await sleep(400); awake(false); }
    else await orb.animate([{ transform: G }, { transform: G + ' scale(1.1, .9)', offset: .2 }, { transform: 'translateY(114px) scale(.95, 1.05)', offset: .5 }, { transform: G + ' scale(1.06, .94)', offset: .8 }, { transform: G }], { duration: 520, easing: 'ease-out' }).finished;
  } finally { fidgeting = false; }
}
setInterval(() => { if (Date.now() < nextFidget) return; nextFidget = Date.now() + 60000 + Math.random() * 90000; fidget(); }, 1000);
// ② 鼠标在附近：扭蛋往光标那边歪，里面那只睁眼跟着看；停在扭蛋上 1.2 秒，它会掀盖探头
let lean = 0, leanTarget = 0, leanRaf = 0, hoverSince = 0, lastPeekEyes = 0;
function leanTick() {
  leanRaf = 0;
  if (!ballIdle()) { lean = 0; return; }
  lean += (leanTarget - lean) * .18;
  if (Math.abs(leanTarget - lean) < .05) lean = leanTarget;
  orb.style.transformOrigin = ''; orb.style.transform = Math.abs(lean) < .05 ? G : G + ' rotate(' + lean + 'deg)';
  if (lean !== leanTarget) leanRaf = requestAnimationFrame(leanTick);
}
api.on('pet-cursor', ({ dx, d }) => {
  const near = d < 300 && Date.now() >= angryUntil;
  leanTarget = near ? Math.max(-9, Math.min(9, dx / 8)) * Math.min(1, (300 - d) / 200) : 0;
  if (!fidgeting && !sulking && !animating && !out) awake(near, dx < -26 ? -1 : dx > 26 ? 1 : 0);
  if (!leanRaf && ballIdle()) leanRaf = requestAnimationFrame(leanTick);
  if (d < 26 && near) {
    if (!hoverSince) hoverSince = Date.now();
    if (Date.now() - hoverSince > 1200 && Date.now() - lastPeekEyes > 20000 && ballIdle() && count === 0) { lastPeekEyes = Date.now(); leanTarget = 0; lean = 0; orb.style.transform = G; crack(1400); }
  } else hoverSince = 0;
});
// 眨眼
setInterval(() => {
  if (animating || (mood !== 'idle' && mood !== 'alert' && mood !== 'focus')) return;
  wrap.classList.add('blink'); setTimeout(() => wrap.classList.remove('blink'), 140);
}, 3800);

// ---------- 鼠标 ----------
// 透明的地方点得穿：由主进程按光标位置判断（这里把团子的轮廓报过去），所以能到这个窗口的按下都算抓它
function reportShape() {
  if (!out) return api.send('pet-shape', null);
  const rows = {};
  for (const q of dangoGrid(form)) { const r = rows[q.y] || (rows[q.y] = [q.x, q.x]); r[0] = Math.min(r[0], q.x); r[1] = Math.max(r[1], q.x); }
  api.send('pet-shape', Object.entries(rows).map(([y, [a, b]]) => [8 + a * 4, 28 + y * 4, 8 + (b + 1) * 4, 32 + y * 4]));
}
wrap.addEventListener('mouseenter', () => { if (out && !animating && !flying && !held) { wagTail(); setTimeout(twitchEar, 300); } });
// 拖动 vs 点击：按下就交给主进程，主进程按光标位置跟随、自己判断是拖还是点（光标甩出窗口时这里收不到 mousemove）
// 只认真正的 pointerup / pointercancel，或之后某次指针事件里左键已经不在按着（窗口跟着光标走，松手后的 move 一定落在窗口上）。
// 捕获丢失 / blur 会在按下后马上冒出来，不能当松手，不然一按就被当成松开 —— 「抓不起来」
const plog = (...a) => api.send('pet-log', a.join(' '));
let down = false;
function startDrag(e) {
  if (e.button !== 0) return;
  if (down) plog('press while down');
  down = true;
  try { wrap.setPointerCapture(e.pointerId); } catch (err) { plog('capture fail', err && err.message); }
  api.send('pet-drag-start', { x: e.screenX, y: e.screenY });
}
function endDrag(reason) { if (!down) return; down = false; api.send('pet-drag-end', reason); }
window.addEventListener('pointerdown', startDrag, true);
window.addEventListener('pointerup', (e) => { if (e.button === 0) endDrag('up'); }, true);
window.addEventListener('pointercancel', () => endDrag('cancel'), true);
window.addEventListener('pointermove', (e) => { if (down && !(e.buttons & 1)) endDrag('move-no-button'); }, true);
wrap.addEventListener('lostpointercapture', () => { if (down) plog('lostpointercapture (ignored)'); });
window.addEventListener('blur', () => { if (down) plog('blur (ignored)'); });
api.on('pet-poke', () => pokeCapsule());
window.addEventListener('contextmenu', (e) => { e.preventDefault(); api.send('pet-menu'); });
window.addEventListener('error', (e) => plog('error', e.message, e.lineno));
</script>
